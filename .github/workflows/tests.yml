name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  unit:
    # Skip private copies of this repository, where Actions minutes are billed.
    if: ${{ !github.event.repository.private }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile sources
        run: python -m compileall -q scripts tests

      # The launcher gives the suite a disposable HOME, Vault, config, and state.
      - name: Run isolated tests
        run: python scripts/run_tests_isolated.py

  powershell:
    # The Python suite assumes POSIX hosts; on Windows, check the adapters parse.
    if: ${{ !github.event.repository.private }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Parse PowerShell adapters
        shell: pwsh
        run: |
          $errorsFound = @()
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            $errorsFound += $errors
          }
          if ($errorsFound.Count -gt 0) {
            $errorsFound | Format-List | Out-String | Write-Error
            exit 1
          }
