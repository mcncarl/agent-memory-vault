# Copy to <runtime>/config/agent-memory.toml after installing the runtime.
# AGENT_MEMORY_* environment variables override matching values in this file.

memory_root = "/path/to/your/agent-memory-vault"
git_root = "/path/to/git-root-containing-the-vault"
config_root = "~/.config/agent-memory"
state_db = "~/.config/agent-memory/state.sqlite"
audit_db = "~/.config/agent-memory/audit_decisions.sqlite"
closeout_log = "~/.config/agent-memory/logs/closeout.jsonl"
audit_run_log = "~/.config/agent-memory/logs/audit_runs.jsonl"
audit_report = "~/.config/agent-memory/reports/latest-audit.json"
invariants_file = "~/.config/agent-memory/config/system-invariants.json"
python = "python3"

user_id = "demo-user"
agent_id = "shared"
app_id = "agent-memory"

[host]
audit_launchagent_label = "com.agent-memory-vault.audit"
audit_launchagent = "~/Library/LaunchAgents/com.agent-memory-vault.audit.plist"

[closeout]
ordinary_memory_candidate_pool = false
ask_before_skill_promotion = true
run_sqlite_index_after_closeout = true
commit_scoped_memory_files = true

[observability]
# Phase-one measurement is additive and non-blocking. It stores only controlled
# labels, counters, and one-way task/memory references; no prompt or excerpt.
enabled = true
stale_adoption_enforcement = "shadow" # shadow | enforce
metadata_enforcement = "shadow" # shadow | enforce
shadow_min_days = 7

[shadow]
# Private, unique attestation files bind the observation window to the exact
# installed Runtime manifest. These cutover fields remain empty until the
# migration-only seven-day gate performs its single atomic config transition.
state_dir = "~/.config/agent-memory/shadow"
status = "observing"
shadow_started_at = ""
runtime_installed_at = ""
manifest_sha256 = ""
cutover_evidence_sha256 = ""
cutover_evidence_file = ""
cutover_from_config_sha256 = ""
cutover_config_backup = ""
cutover_at = ""

[write_gateway]
# Safe default for a fresh v2 installation: every automatic Markdown write is
# mediated by a current path fence and an active intent. Upgrades must pass the
# explicit plan/apply/verify migration before ordinary commands become ready.
mode = "enforce" # off | advisory | enforce
writer_protocol_version = 2
state_schema_required = 4
canonical_actors = ["codex", "claude", "ailu"]
path_fencing = true
claims_are_projection = true
full_vault = true
ttl_hours = 24
max_proposal_bytes = 2097152
max_target_bytes = 8388608
max_snapshot_bytes = 262144

# Migration compatibility only. Runtime code reads [write_gateway] first.
[write_intents]
enabled = false
enforcement = "off"
protected_paths = []

[semantic_retrieval]
enabled = false
semantic_mode = "auto" # auto | off | required
ranking_version = "hybrid-v2-shadow" # hybrid-v1 | hybrid-v2-shadow | hybrid-v2
vector_dir = "~/.config/agent-memory/zvec/memory_chunks_embeddinggemma_768"
embedding_model = "google/embeddinggemma-300m"
embedding_dim = 768
embedding_device = "cpu"
python = "python3"
lock_path = "~/.config/agent-memory/locks/zvec.lock"
zvec_lock_timeout_seconds = 2
zvec_max_distance = 0.72
require_local_model = false
# Exact EmbeddingGemma snapshot commit; replace only together with a freshly
# verified private model manifest for the new revision.
model_revision = "57c266a740f537b4dc058e1b0cda161fd15afa75"
model_manifest = "~/.config/agent-memory/models/embeddinggemma-300m/model-manifest.json"
dependency_lock = "~/.config/agent-memory/requirements-vector.lock"
candidate_pool_min = 64
candidate_pool_factor = 16
candidate_pool_scope_min = 128
candidate_pool_max = 512
embedding_worker_socket = "~/.config/agent-memory/run/embedding.sock"
embedding_worker_idle_seconds = 600
embedding_worker_cold_timeout_seconds = 12
embedding_worker_warm_timeout_seconds = 2
run_vector_index_after_closeout = false

[privacy]
include_real_vault = false
include_state_db = false
include_env_file = false
include_vector_db = false
include_model_cache = false
